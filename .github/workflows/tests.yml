name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 產生假資料並分類
        run: |
          python make_sample_data.py
          python classify.py --raw sample_data/raw_*.xlsx --history sample_data/history_2026.09.xlsx --sources sample_data/sources.xlsx --override 鄭同學=親友 --out output/draft.xlsx
      - name: 交叉分析並檢查三表勾稽
        run: |
          python analyze.py --input sample_data/2026.10_classified_sample.xlsx --outdir output/analysis --title 2026.10 --judge S015=通路 --weeks 10/01-10/09,10/10-10/16,10/17-10/23,10/24-10/31 | tee out.txt
          grep -q "勾稽 通過" out.txt
